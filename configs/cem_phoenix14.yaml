feeder: dataset.dataloader_video.BaseFeeder
phase: train
dataset: phoenix14
num_epoch: 40
work_dir: ./work_dir/cem_phoenix14_20261115/
batch_size: 2
random_seed: 0
test_batch_size: 8
num_worker: 10
device: 0
log_interval: 20
eval_interval: 1
save_interval: 5
evaluate_tool: sclite

loss_weights:
  SeqCTC: 1.0
  ConvCTC: 1.0
  CFA: 1.0
  CauKL: 0.25
  CauSep: 0.9

optimizer_args:
  optimizer: Adam
  base_lr: 0.0001
  step: [20, 35]
  learning_ratio: 1
  weight_decay: 0.0001
  start_epoch: 0
  nesterov: False

feeder_args:
  mode: train
  datatype: video
  num_gloss: -1
  drop_ratio: 1.0

model: slr_cem_network.CEMSLRModel
decode_mode: beam
model_args:
  num_classes: 1296
  c2d_type: resnet34
  conv_type: 2
  use_bn: 1
  share_classifier: False
  weight_norm: False
  hidden_size: 1024
  pretrained_backbone: True
  gradient_checkpointing: True
  cfe_reduction: 8
  text_model_path: ./pretrained/bert-base-german-cased
  text_hidden_size: 768
  freeze_text_encoder: True
  text_max_length: 8
  causal_beta: 1.0
